<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="600" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.8" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  
  <!-- Sky / Background -->
  <rect width="1200" height="400" fill="url(#skyGradient)"/>
  
  <!-- Distant Hill (Blue-ish Green) -->
  <path d="M0 150C300 100 500 200 700 150C900 100 1100 200 1200 150V400H0V150Z" fill="#A5D6A7" fill-opacity="0.4"/>
  
  <!-- Middle Hill (Meadow Green) -->
  <path d="M0 200C200 150 400 250 600 200C800 150 1000 250 1200 200V400H0V200Z" fill="#81C784" fill-opacity="0.6"/>
  
  <!-- Front Hill (Vibrant Green) -->
  <path d="M0 250C150 200 300 300 450 250C600 200 750 300 900 250C1000 200 1100 300 1200 250V400H0V250Z" fill="#3CB371" fill-opacity="0.8"/>
  
  <!-- Subtle Sunlight Glow -->
  <circle cx="1000" cy="50" r="200" fill="#FFF9C4" fill-opacity="0.2"/>
</svg>
